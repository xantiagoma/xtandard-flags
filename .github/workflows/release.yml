name: Release

# Publishes to npm when a version tag is pushed (e.g. v0.1.0).
#
# First release:    git tag v0.1.0 && git push origin v0.1.0
# Ongoing releases: bun run release   (changelogen bumps from conventional
#                   commits, writes CHANGELOG.md, commits, tags, and pushes —
#                   which triggers this workflow).
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. The trust is
# configured on npmjs.com for this repo + this workflow file
# (`npm trust github @xtandard/flags --repo xantiagoma/xtandard-flags --file release.yml`),
# and needs npm >= 11.5.1 (Node 24 ships it).
#
# Re-publish an existing tag (e.g. after a failed publish): run this workflow
# manually with `tag` set — `gh workflow run release.yml -f tag=v0.1.9`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.9)"
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package
        run: bunx publint

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public

      # Turn the pushed tag into a GitHub Release (shown on /releases) with notes
      # auto-generated from the commits since the previous tag. `bun run release`
      # (changelogen) may have already created this as a DRAFT release with its own
      # notes — in that case publish it (don't skip), otherwise create + publish.
      - name: Create or publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — publishing it (was likely a changelogen draft)."
            gh release edit "${TAG}" --draft=false --latest
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
