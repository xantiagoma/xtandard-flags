name: Release

# Publishes to npm when a version tag is pushed (e.g. v0.1.0).
#
# First release:    git tag v0.1.0 && git push origin v0.1.0
# Ongoing releases: bun run release   (changelogen bumps from conventional
#                   commits, writes CHANGELOG.md, commits, tags, and pushes —
#                   which triggers this workflow).
#
# The kit's reusable release-prepare.yml checks the tag against package.json,
# runs the gate, builds, runs publint, packs the tarball and extracts the notes.
# Publishing stays in this file: npm trusted publishing validates the calling
# workflow, so the `publish` job below runs `npm publish` on the prepared
# tarball.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. The trust is
# configured on npmjs.com for this repo + this workflow file
# (`npm trust github @xtandard/flags --repo xantiagoma/xtandard-flags --file release.yml`),
# and needs npm >= 11.5.1 (Node 24 ships it).
#
# Re-publish an existing tag (e.g. after a failed publish): run this workflow
# manually with `tag` set — `gh workflow run release.yml -f tag=v0.1.3`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.3)"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    uses: xantiagoma/xtandard-kit/.github/workflows/release-prepare.yml@v0.1
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARBALL: ${{ needs.prepare.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pack

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Publish to npm (with provenance)
        run: npm publish "pack/${TARBALL}" --provenance --access public

      # Turn the pushed tag into a GitHub Release (shown on /releases), with the
      # tag's CHANGELOG.md section and a compare link (from release-prepare).
      - name: Create or publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — publishing it (was likely a changelogen draft)."
            gh release edit "${TAG}" --draft=false --latest --notes-file notes.md
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md --verify-tag --latest
          fi
